particle_filter:
  ros__parameters:
    scan_topic: '/autodrive/roboracer_1/lidar'
    odometry_topic: '/odometry/filtered'

    # RF2O axes already corrected
    odom_axis_mode: 'normal'

    # Best current PF accuracy baseline
    angle_step: 12
    max_particles: 2000
    squash_factor: 2.2

    viz: 1
    max_viz_particles: 60

    range_method: 'cddt'
    rangelib_variant: 2
    theta_discretization: 112

    max_range: 10
    fine_timing: 0
    publish_odom: 1

    z_short: 0.01
    z_max: 0.07
    z_rand: 0.12
    z_hit: 0.75
    sigma_hit: 8.0

    motion_dispersion_x: 0.005
    motion_dispersion_y: 0.025
    motion_dispersion_theta: 0.25

    # Important: better to publish initial pose manually for testing
    use_initial_pose: true
    initial_pose_x: 0.7994
    initial_pose_y: 3.1583
    initial_pose_yaw: -1.5708

    max_odom_delta: 0.50
    max_odom_dtheta: 0.70

    map_frame: 'map'
    base_frame: 'roboracer_1'
    lidar_frame: 'lidar'
    lidar_x_offset: 0.2733
    lidar_y_offset: 0.0

map_server:
  ros__parameters:
    map: 'new_roboracer_map'