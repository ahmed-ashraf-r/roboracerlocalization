particle_filter:
  ros__parameters:
    # ============================================================
    # INPUTS
    # ============================================================
    scan_topic: '/autodrive/roboracer_1/lidar'
    odometry_topic: '/odometry/filtered'
    odom_axis_mode: 'normal'

    # ============================================================
    # FRAMES / LIDAR EXTRINSICS
    # Particles represent map -> roboracer_1.
    # The measured base -> lidar translation is +0.2733 m in X.
    # ============================================================
    map_frame: 'map'
    base_frame: 'roboracer_1'
    lidar_frame: 'lidar'
    lidar_x_offset: 0.2733
    lidar_y_offset: 0.0
    lidar_yaw_offset: 0.0

    # ============================================================
    # HIGH-SPEED TIME SYNCHRONIZATION / DESKEW
    # ============================================================
    enable_lidar_deskew: true

    # Keep enough 50-Hz EKF history to interpolate every LiDAR beam.
    odom_buffer_seconds: 3.0

    # Scans wait here until EKF history covers the final ray timestamp.
    max_pending_scans: 6

    # max_odom_delta/max_odom_dtheta remain reset/glitch floors.
    # Valid high-speed motion larger than these is accepted while the
    # implied rate stays below the physical plausibility limits below.
    max_odom_delta: 0.50
    max_odom_dtheta: 0.70
    max_odom_speed: 20.0
    max_odom_yaw_rate: 20.0

    # ============================================================
    # RACING V5 MAP-SAFE CORRIDOR PARTICLES / RANGE LIBRARY
    # Goal: lower LiDAR->PF latency while retaining more rays than the
    # original 2000/step12 configuration.
    # 2500 particles + ~109 LiDAR rays/update.
    # ============================================================
    max_particles: 2000
    max_viz_particles: 60
    angle_step: 10

    range_method: 'cddt'
    rangelib_variant: 2
    theta_discretization: 160
    max_range: 10.0
    fine_timing: 0

    # ============================================================
    # SENSOR MODEL
    # Keep baseline unchanged while validating high-speed deskew.
    # ============================================================
    z_short: 0.02
    z_max: 0.07
    z_rand: 0.09
    z_hit: 0.82
    sigma_hit: 6.0
    squash_factor: 2.0

    # ============================================================
    # MOTION MODEL
    # These are motion-scaled coefficients in the corrected PF.
    # ============================================================
    motion_dispersion_x: 0.006
    motion_dispersion_y: 0.018
    motion_dispersion_theta: 0.18
    motion_noise_floor_x: 0.0005
    motion_noise_floor_y: 0.0005
    motion_noise_floor_theta: 0.001
    motion_noise_theta_distance_scale: 0.007

    # Adaptive longitudinal diversity for corridor/high-dynamics sections.
    # Extra sigma_long = min(cap, gain * |estimated acceleration|).
    motion_noise_long_accel_gain: 0.015
    motion_noise_long_accel_cap: 0.100
    motion_accel_cap: 8.0

    # Sparse longitudinal recovery hypotheses for high-speed corridor runs.
    recovery_tail_ratio: 0.0
    recovery_tail_sigma: 0.22
    recovery_tail_accel_threshold: 1.50
    recovery_tail_speed_threshold: 4.50

    # ============================================================
    # RACING V4 FORWARD-INFORMATION RAY SELECTION
    # ============================================================
    # Approx. 111 rays/update on the 1081-beam LiDAR:
    #   front +/-60 deg : every 6th beam (~1.5 deg)
    #   side sectors    : every 20th beam (~5.0 deg)
    #
    # Similar/lower compute cost than V3 but much stronger sensitivity
    # to the corridor end wall and upcoming corner.
    front_ray_angle_deg: 60.0
    front_ray_step: 6
    side_ray_step: 20

    # ============================================================
    # RACING V4 LONGITUDINAL RECOVERY BANK
    # ============================================================
    # 15% of particles are used as long-range hypotheses, but they carry
    # only 10% of total prior probability.
    #
    # At N=2000:
    #   bank particles = ~300
    #
    # The bank spans up to +/-4 m along vehicle heading.  During positive
    # acceleration it is biased forward because the measured 100% failure
    # is an under-estimated motion prior.
    recovery_bank_ratio: 0.15
    recovery_bank_weight: 0.10
    recovery_bank_half_span: 4.0
    recovery_bank_min_speed: 4.5
    recovery_bank_max_abs_wz: 0.25
    recovery_bank_lateral_sigma: 0.03
    recovery_bank_yaw_sigma: 0.015
    recovery_bank_accel_bias_threshold: 0.50

    # ============================================================
    # RACING V5 MAP / RANGELIB SAFETY
    # ============================================================

    # Bank must remain straight for at least two ~20-Hz LiDAR updates.
    # Prevents activation merely because yaw rate crosses zero between turns.
    recovery_bank_straight_hold_time: 0.10

    # Keep long-range hypotheses away from map boundaries.
    recovery_bank_map_margin: 0.10

    # Do not spend recovery particles inside walls / unknown map cells.
    recovery_bank_require_free_space: true

    # Absolute last-resort guard for every RangeLib ray origin.
    raycast_map_margin: 0.05

    # ============================================================
    # ESS RESAMPLING
    # ============================================================
    ess_threshold_ratio: 0.35

    # ============================================================
    # KNOWN START POSE
    # ============================================================
    use_initial_pose: true
    initial_pose_x: 0.7994
    initial_pose_y: 3.1583
    initial_pose_yaw: -1.5708
    initial_std_x: 0.02
    initial_std_y: 0.02
    initial_std_yaw: 0.0174533
    initialpose_use_message_covariance: false

    # ============================================================
    # OUTPUT
    # ============================================================
    publish_odom: 1
    viz: 1
    publish_pf_tf: false

map_server:
  ros__parameters:
    map: 'final_2026_iros'
