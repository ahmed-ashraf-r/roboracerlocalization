particle_filter:
  ros__parameters:
    # ============================================================
    # INPUTS
    # ============================================================
    scan_topic: '/autodrive/roboracer_1/lidar'
    odometry_topic: '/odometry/filtered'
    odom_axis_mode: 'normal'

    # ============================================================
    # FRAMES / LIDAR EXTRINSICS
    # Particles represent map -> roboracer_1.
    # The measured base -> lidar translation is +0.2733 m in X.
    # ============================================================
    map_frame: 'map'
    base_frame: 'roboracer_1'
    lidar_frame: 'lidar'
    lidar_x_offset: 0.2733
    lidar_y_offset: 0.0
    lidar_yaw_offset: 0.0

    # ============================================================
    # HIGH-SPEED TIME SYNCHRONIZATION / DESKEW
    # ============================================================
    enable_lidar_deskew: true

    # Keep enough 50-Hz EKF history to interpolate every LiDAR beam.
    odom_buffer_seconds: 3.0

    # Scans wait here until EKF history covers the final ray timestamp.
    max_pending_scans: 6

    # max_odom_delta/max_odom_dtheta remain reset/glitch floors.
    # Valid high-speed motion larger than these is accepted while the
    # implied rate stays below the physical plausibility limits below.
    max_odom_delta: 0.50
    max_odom_dtheta: 0.70
    max_odom_speed: 20.0
    max_odom_yaw_rate: 20.0

    # ============================================================
    # RACING V2 PARTICLES / RANGE LIBRARY
    # Goal: lower LiDAR->PF latency while retaining more rays than the
    # original 2000/step12 configuration.
    # 2500 particles + ~109 LiDAR rays/update.
    # ============================================================
    max_particles: 2500
    max_viz_particles: 60
    angle_step: 10

    range_method: 'cddt'
    rangelib_variant: 2
    theta_discretization: 160
    max_range: 10.0
    fine_timing: 0

    # ============================================================
    # SENSOR MODEL
    # Keep baseline unchanged while validating high-speed deskew.
    # ============================================================
    z_short: 0.02
    z_max: 0.07
    z_rand: 0.09
    z_hit: 0.82
    sigma_hit: 7.0
    squash_factor: 2.5

    # ============================================================
    # MOTION MODEL
    # These are motion-scaled coefficients in the corrected PF.
    # ============================================================
    motion_dispersion_x: 0.006
    motion_dispersion_y: 0.018
    motion_dispersion_theta: 0.18
    motion_noise_floor_x: 0.0005
    motion_noise_floor_y: 0.0005
    motion_noise_floor_theta: 0.001
    motion_noise_theta_distance_scale: 0.007

    # Adaptive longitudinal diversity for corridor/high-dynamics sections.
    # Extra sigma_long = min(cap, gain * |estimated acceleration|).
    motion_noise_long_accel_gain: 0.010
    motion_noise_long_accel_cap: 0.070
    motion_accel_cap: 8.0

    # ============================================================
    # ESS RESAMPLING
    # ============================================================
    ess_threshold_ratio: 0.45

    # ============================================================
    # KNOWN START POSE
    # ============================================================
    use_initial_pose: true
    initial_pose_x: 0.7994
    initial_pose_y: 3.1583
    initial_pose_yaw: -1.5708
    initial_std_x: 0.02
    initial_std_y: 0.02
    initial_std_yaw: 0.0174533
    initialpose_use_message_covariance: false

    # ============================================================
    # OUTPUT
    # ============================================================
    publish_odom: 1
    viz: 1
    publish_pf_tf: false

map_server:
  ros__parameters:
    map: 'final_2026_iros'
